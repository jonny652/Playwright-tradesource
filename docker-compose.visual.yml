# Runs the visual regression project in the SAME Linux image that CI uses, so local results match GitHub.
#
#   npm run test:visual:docker   compare against the committed baselines
#   npm run test:visual:update   regenerate baselines (writes into tests/__screenshots__ on your machine, then review + commit)
#
# Keep the image tag in step with @playwright/test in package-lock.json (currently 1.64.1) AND with the visual job in
# .github/workflows/playwright.yml. Needs ./tradesource-site cloned (see README).
x-visual: &visual
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  working_dir: /work
  ipc: host
  environment:
    CI: "true"                  # same behaviour as GitHub: the site is always started fresh
    PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble
  volumes:
    - .:/work
    - linux_node_modules:/work/node_modules   # Linux copy of node_modules, so Windows modules are never used in the container

services:
  visual:
    <<: *visual
    command: sh -c "npm ci && npx playwright test --project=visual-desktop-1280x720"

  visual-update:
    <<: *visual
    command: sh -c "npm ci && npx playwright test --project=visual-desktop-1280x720 --update-snapshots=all && node scripts/visual-manifest.mjs && node scripts/visual-gallery.mjs"

volumes:
  linux_node_modules:
