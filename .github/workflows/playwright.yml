name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Generate/update visual regression baselines instead of comparing against them'
        type: boolean
        default: false
jobs:
  test:
    timeout-minutes: 60
    # Pinned rather than ubuntu-latest, so the runner OS (and the browser builds made for it) doesn't change underneath us
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Checkout tradesource-site (app under test)
      uses: actions/checkout@v4
      with:
        repository: samGreenwood2022/tradesource-site
        path: tradesource-site
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    # Cache the browser binaries, keyed on the OS release and installed Playwright version.
    # Browser builds are made for a specific Ubuntu release, so a cache from a different release must not be reused
    - name: Get installed Playwright version and OS release
      id: playwright-version
      run: |
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.playwright-version.outputs.os }}-playwright-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    # OS-level dependencies live outside the cache folder, so they still need installing on a cache hit
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run Playwright tests
      if: ${{ !inputs.update_visual_baselines }}
      run: npx playwright test
      env:
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
    - name: Generate visual regression baselines
      if: ${{ inputs.update_visual_baselines }}
      run: npm run test:visual:generate-baselines
      env:
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload visual baselines
      if: ${{ inputs.update_visual_baselines && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: visual-baselines
        path: tests/__screenshots__/
        retention-days: 30
