name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    # Pinned rather than ubuntu-latest, so the runner OS (and the browser builds made for it) doesn't change underneath us
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Checkout tradesource-site (app under test)
      uses: actions/checkout@v4
      with:
        repository: samGreenwood2022/tradesource-site
        path: tradesource-site
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    # Cache the browser binaries, keyed on the OS release and installed Playwright version.
    # Browser builds are made for a specific Ubuntu release, so a cache from a different release must not be reused
    - name: Get installed Playwright version and OS release
      id: playwright-version
      run: |
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.playwright-version.outputs.os }}-playwright-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    # OS-level dependencies live outside the cache folder, so they still need installing on a cache hit
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    # On the first run there are no Linux baselines in the repo, so they are generated here.
    # Download this artifact, extract it into tests/visual-baselines/linux/ and commit it
    - name: Upload Linux visual baselines
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: linux-visual-baselines
        path: tests/visual-baselines/linux/
        if-no-files-found: ignore
        retention-days: 30
    # Actual, expected (baseline copy) and diff screenshots for any failed visual comparison
    - name: Upload visual diffs
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: visual-diffs
        path: test-results/**/*.png
        if-no-files-found: ignore
        retention-days: 30
